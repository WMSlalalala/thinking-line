(function(){

var LINKS=[

];

/* ---------- storage (all wrapped: the page must work with none) ---------- */
var memory={};function g(k){if(Object.prototype.hasOwnProperty.call(memory,k))return memory[k];try{return localStorage.getItem(k)}catch(e){return null}}
function s(k,v){memory[k]=v;try{localStorage.setItem(k,v);return true}catch(e){return false}}

/* ---------- theme ---------- */
var root=document.documentElement,tg=document.getElementById('tg');
function eff(){var t=g('th_theme');if(t==='light'||t==='dark')return t;return matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}
function theme(){var t=g('th_theme');if(t==='light'||t==='dark')root.setAttribute('data-theme',t);else root.removeAttribute('data-theme');tg.textContent=eff()==='dark'?'light':'dark'}
tg.addEventListener('click',function(){s('th_theme',eff()==='dark'?'light':'dark');theme()});theme();

/* ---------- tracks ---------- */
var TRACKS={
  research:{name:'Research notes',blurb:'Papers on agent systems and agent security, organized by topic.'},
  creative:{name:'Creative projects',blurb:'Finding interesting things to make with generative tools.'},
  life:{name:'Life',blurb:'Road trips and fishing — what happens when the laptop is shut.'}
};
var RESEARCH_TOPICS={
  'gui-agent':{name:'GUI agents',description:'Agents that perceive interfaces, ground instructions, and act across web, desktop, and mobile environments.',filters:['framework','grounding','memory','benchmark','training']},
  'agent-security':{name:'Agent security',description:'Authorization, prompt injection, misuse, and the evaluation of agent safety.',filters:['authorization','prompt-injection','framework','benchmark','privacy']},
  'models-methods':{name:'Models & methods',description:'Agent architectures, foundation models, and efficient training and visual encoding methods.',filters:['architecture','training','adaptation','efficiency']}
};
function researchTopic(p){return p.topic||(p.tags.indexOf('agent-security')>=0?'agent-security':['hu2022lora','fastvlm','qwen25-technical-report'].indexOf(p.id)>=0?'models-methods':'gui-agent')}

/* ---------- posts ---------- */
function ago(n){return Date.now()-n*86400000}
PAPERS.forEach(function(p){(p.comments||[]).forEach(function(c){if(c.daysAgo!=null)c.ts=ago(c.daysAgo)})});
var POSTS=PAPERS.concat(__POSTS_JSON__);
var BY={};POSTS.forEach(function(p){BY[p.id]=p});
function byDate(a,b){return b.date.localeCompare(a.date)}

/* ---------- formatting ---------- */
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function nviews(p){return sharedStats[p.id]?sharedStats[p.id].views:'—'}
function nhooks(p){return sharedStats[p.id]?sharedStats[p.id].hooks:'—'}
/* ---------- helpers ---------- */
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rel(ts){var s=(Date.now()-ts)/1e3;if(s<60)return'just now';var m=s/60;if(m<60)return Math.floor(m)+' min ago';var h=m/60;if(h<24)return Math.floor(h)+' h ago';var d=h/24;if(d<45)return Math.floor(d)+' d ago';return new Date(ts).toISOString().slice(0,10)}
function localC(id){return gj('th_comments',{})[id]||[]}
function addC(id,c){var all=gj('th_comments',{});(all[id]=all[id]||[]).push(c);sj('th_comments',all)}
function allC(p){return sharedComments[p.id]||[]}
function tagsHTML(p){return p.tags.map(function(t){return '<button class="note-tag" type="button" data-topic="'+researchTopic(p)+'" data-filter-tag="'+esc(t)+'" aria-label="Filter notes by '+esc(t)+'">#'+esc(t)+'</button>'}).join('')}

function cropImage(f,lazy){var c=f.crop;if(!c)return '<img src="'+esc(f.src)+'" alt="'+esc(f.alt)+'"'+(lazy?' loading="lazy"':'')+' decoding="async">';return '<span class="image-crop" style="aspect-ratio:'+c.cropWidth+'/'+c.cropHeight+'"><img src="'+esc(f.src)+'" alt="'+esc(f.alt)+'"'+(lazy?' loading="lazy"':'')+' decoding="async" style="width:'+((c.width/c.cropWidth)*100)+'%;transform:translate('+(-c.left/c.width*100)+'%,'+(-c.top/c.height*100)+'%)"></span>'}
function figureHTML(p){if(!p.figure)return '';var f=p.figure;return '<figure class="method-figure"><a href="'+esc(f.src)+'" target="_blank" rel="noopener" aria-label="Open '+esc(f.figureLabel)+' at full size">'+cropImage(f,false)+'</a><figcaption>'+esc(f.caption)+' <a href="'+esc(f.sourcePage)+'" target="_blank" rel="noopener">'+esc(f.figureLabel)+' from the paper ↗</a><span class="figure-credit">Original figure by '+esc(p.authors)+'. '+(f.licenseUrl?'<a href="'+esc(f.licenseUrl)+'" target="_blank" rel="noopener">'+esc(f.license)+'</a>':esc(f.license||'Rights retained by the original authors'))+'.</span></figcaption></figure>'}
function rowMedia(p){return p.methodDiagram?'<span class="diagram-preview" aria-hidden="true">'+p.methodDiagram.steps.map(function(step){return '<span>'+esc(step.title)+'</span>'}).join('')+'</span>':cropImage(p.figure,true)}
/* ---------- rows ---------- */
function rowHTML(p,opts){opts=opts||{};var sub='';
  if(p.kind==='paper'||p.kind==='standard')sub='<div class="s">'+esc(p.authors)+' · '+esc(p.venue)+'</div>';
  var k='<div class="k">'+tagsHTML(p)+'<span class="row-count"><span data-views="'+p.id+'">'+fmt(nviews(p))+'</span> reads</span></div>';
  var hasMedia=!!(p.figure||p.methodDiagram);
  return '<article class="row'+(hasMedia?' with-figure':'')+'"><div class="d">'+p.date+'</div><div class="row-copy"><a class="note-link" href="#/post/'+p.id+'"><div class="t">'+esc(p.title)+'</div>'+sub+(opts.take!==false?'<p class="x">'+esc(p.take)+'</p>':'')+'</a>'+k+'</div>'+(hasMedia?'<a class="row-figure" href="#/post/'+p.id+'" aria-label="Read '+esc(p.title)+'">'+rowMedia(p)+'</a>':'')+'</article>'}

/* ---------- views ---------- */
function home(){var latest=POSTS.slice().sort(byDate).slice(0,5);
  return '<section class="hero"><figure class="portrait"><img src="'+PORTRAIT+'" alt="Mingshuo Wang standing in front of red sandstone cliffs" width="720" height="720"></figure><div>'+
  '<h1>Mingshuo Wang</h1><p class="role">PhD student at NC State · since 2021</p>'+
  '<p class="intro">I study large language models and agentic AI, with a focus on agent systems and agent security. Thinking Line is where I work through the papers I read, the things I make, and life beyond the screen.</p>'+
  '<div class="links">'+LINKS.map(function(l){return '<a href="'+l[1]+'" target="_blank" rel="noopener">'+l[0]+' ↗</a>'}).join('')+'</div></div></section>'+
  '<section class="home-main"><h2 class="h">Latest notes <a href="#/research">Browse topics ↗</a></h2><div class="ledger">'+latest.map(function(p){return rowHTML(p,{track:false,take:true})}).join('')+'</div></section>'+
  '<aside class="home-explore"><nav class="explore-links" aria-label="Explore"><h2 class="h">Explore</h2>'+Object.keys(TRACKS).map(function(k){return '<a href="#/'+k+'">'+TRACKS[k].name+'</a>'}).join('')+'</nav><a class="feedback" href="mailto:mwnag49@ncsu.edu"><span>Feedback</span>mwnag49@ncsu.edu ↗</a></aside>'}

var RS={q:'',tags:{},topic:''};
function rlist(topic){return POSTS.filter(function(p){return p.track==='research'&&(!topic||researchTopic(p)===topic)}).sort(byDate)}
function research(topic){
  if(!RESEARCH_TOPICS[topic]){RS={q:'',tags:{},topic:''};return '<div class="index-title"><h1 class="title">Research notes</h1><small>'+rlist().length+' notes</small></div><p class="intro muted">Choose a topic to explore the papers.</p><div class="topic-grid">'+Object.keys(RESEARCH_TOPICS).map(function(key){var t=RESEARCH_TOPICS[key];return '<a class="topic-card" data-research-topic="'+key+'" href="#/research/'+key+'"><h2>'+esc(t.name)+'</h2><p>'+esc(t.description)+'</p><span class="topic-count"><span>'+rlist(key).length+' notes</span><span class="arrow" aria-hidden="true">→</span></span></a>'}).join('')+'</div>'}
  if(RS.topic!==topic)RS={q:'',tags:{},topic:topic};
  return '<a class="back" href="#/research">← Research topics</a><div class="index-title module-title"><h1 class="title">'+esc(RESEARCH_TOPICS[topic].name)+'</h1></div><p class="intro muted">'+esc(RESEARCH_TOPICS[topic].description)+'</p>'+
  '<div class="research-browser"><aside class="research-sidebar" aria-label="Filter '+esc(RESEARCH_TOPICS[topic].name)+'"><h2>Filter topics</h2><div id="topic-filters"></div></aside><div class="research-results"><div class="search"><input id="q" aria-label="Search '+esc(RESEARCH_TOPICS[topic].name)+' notes" type="search" placeholder="Search this topic…" value="'+esc(RS.q)+'" autocomplete="off"><span id="cnt" role="status" aria-live="polite"></span><span>/ to focus</span></div><div class="active-filters" id="active-filters"></div><div class="ledger" id="rlist"></div></div></div>'}
function filterResearch(){var list=rlist(RS.topic);var q=RS.q.trim().toLowerCase();var on=Object.keys(RS.tags).filter(function(t){return RS.tags[t]});
  var searched=list.filter(function(p){if(!q)return true;var hay=[p.title,p.authors||'',p.venue||'',p.take||'',p.bib||'',p.arxiv||'',p.tags.join(' '),(p.keywords||[]).join(' ')].join(' ').toLowerCase();return q.split(/\s+/).every(function(w){return hay.indexOf(w)>=0})});
  var out=searched.filter(function(p){return !on.length||on.some(function(t){return p.tags.indexOf(t)>=0})});
  var el=document.getElementById('rlist'),c=document.getElementById('cnt');if(!el)return;
  el.innerHTML=out.length?out.map(function(p){return rowHTML(p)}).join(''):'<p class="empty">Nothing matches. Try a broader word, or clear the tags.</p>';

  var sidebar=document.getElementById('topic-filters');if(sidebar&&RESEARCH_TOPICS[RS.topic])sidebar.innerHTML='<button type="button" class="sidebar-filter'+(!on.length?' on':'')+'" data-clear-topics aria-pressed="'+(!on.length)+'">All notes <span>'+searched.length+'</span></button>'+RESEARCH_TOPICS[RS.topic].filters.map(function(tag){var selected=!!RS.tags[tag];return '<button type="button" class="sidebar-filter'+(selected?' on':'')+'" data-filter-tag="'+tag+'" data-topic="'+RS.topic+'" aria-pressed="'+selected+'">#'+tag+'<span>'+searched.filter(function(p){return p.tags.indexOf(tag)>=0}).length+'</span></button>'}).join('');
  var active=document.getElementById('active-filters');if(active)active.innerHTML=on.map(function(t){return '<button type="button" class="note-tag active-tag" data-remove-tag="'+esc(t)+'" aria-label="Remove '+esc(t)+' filter">#'+esc(t)+' ×</button>'}).join('')+(on.length||q?'<button type="button" class="clear-filter" data-clear-filters>Clear filters</button>':'');syncCounts()}

function section(k){var list=POSTS.filter(function(p){return p.track===k}).sort(byDate);
  return '<h1 class="title" style="margin-top:2.2rem">'+TRACKS[k].name+'</h1><p class="intro muted">'+TRACKS[k].blurb+'</p><div class="ledger" style="margin-top:1.4rem">'+(list.length?list.map(function(p){return rowHTML(p)}).join(''):'<p class="empty">Notes will appear here as I write them.</p>')+'</div>'}

function paragraphs(values){return (values||[]).map(function(value){return '<p>'+esc(value)+'</p>'}).join('')}

function researchBody(p){var n=p.note;if(!n)return '<div class="prose">'+p.body+'</div>';

  '<section class="note-section"><h2>Contributions</h2><div class="prose"><ul>'+n.contributions.map(function(c){return '<li>'+esc(c)+'</li>'}).join('')+'</ul></div></section>'+
  '<section class="note-section"><h2>Method</h2><div class="prose">'+paragraphs(n.method)+'</div>'+(p.methodDiagram?methodFlow(p):figureHTML(p))+'</section>'+

function post(id){var p=BY[id];if(!p)return '<p class="empty" style="margin-top:2rem">No such note. <a href="#/" style="text-decoration:underline">Back home</a>.</p>';

  var meta='';if(p.kind==='paper'||p.kind==='standard'){meta='<div class="paper"><b>Authors</b><span>'+esc(p.authors)+'</span><b>Venue</b><span>'+esc(p.venue)+'</span>'+(p.arxiv?'<b>arXiv</b><span><a href="https://arxiv.org/abs/'+esc(p.arxiv)+'" target="_blank" rel="noopener">arxiv.org/abs/'+esc(p.arxiv)+' ↗</a></span>':'')+(p.url?'<b>Link</b><span><a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.url.replace(/^https?:\/\//,''))+' ↗</a></span>':'')+(p.bib?'<b>Cite as</b><span>'+esc(p.bib)+'</span>':'')+'</div>'}
  var cs=allC(p);
  var topic=p.track==='research'?researchTopic(p):null;
  return '<a class="back" href="#/'+(topic?'research/'+topic:p.track)+'">← '+(topic?RESEARCH_TOPICS[topic].name:TRACKS[p.track].name)+'</a>'+
  '<div class="kick"><span>'+p.date+'</span><span>·</span><span>'+p.read+' min</span><span>·</span><span><span data-views="'+p.id+'">'+fmt(nviews(p))+'</span> reads</span>'+(p.kind==='essay'?'<span>·</span><span>essay</span>':'')+'</div>'+
  '<h1 class="title">'+p.title+'</h1>'+((p.kind==='paper'||p.kind==='standard')&&p.take?'<p class="take">'+p.take+'</p>':'')+meta+
  (p.track==='research'?researchBody(p):'<div class="prose">'+p.body+'</div>')+
  '<div class="hookrow"><button type="button" class="hook'+(sharedMine[p.id]?' on':'')+'" id="hook">'+HOOK+'<span id="hooklbl">'+(sharedMine[p.id]?'Hooked':'Hook this')+' · '+nhooks(p)+'</span></button><span class="vw">'+tagsHTML(p)+'</span></div>'+
  '<section class="comments"><h2 class="h">Comments <small id="ccount">'+cs.length+'</small></h2><div class="clist" id="clist">'+(cs.length?cs.map(cHTML).join(''):'<p class="empty">Loading comments…</p>')+'</div>'+
  '<form class="form" id="cform" autocomplete="off"><input id="cname" aria-label="Name (optional)" maxlength="40" placeholder="Name (optional)"><textarea id="cbody" aria-label="Comment" required maxlength="1500" placeholder="Say something — no account needed."></textarea><div class="honeypot" aria-hidden="true"><label>Website<input id="website" tabindex="-1" autocomplete="off"></label></div><div class="frow"><button class="btn" type="submit">Post comment</button><p class="note">No account needed. Your comment and optional name will be public.</p></div><p class="note" id="comment-status" role="status" aria-live="polite"></p></form></section>'}
function cHTML(c){return '<div class="c"><div class="ct">'+rel(c.ts)+'</div><div><div class="cn">'+esc(c.name)+(c.mine?'<small>author</small>':'')+'</div><p class="cb">'+esc(c.body)+'</p></div></div>'}

function about(){return '<h1 class="title" style="margin-top:2.2rem">About</h1><div class="prose">'+
  '<p><strong>Thinking Line</strong> is my notebook in public. Three things live here:</p>'+
  '<ul><li><strong>Research notes</strong> — papers on agent systems and agent security.</li><li><strong>Creative projects</strong> — fun things I make with generative tools and vibe coding.</li><li><strong>Life</strong> — road trips and fishing.</li></ul></div>'}

  lineRaf=0;var bottom=0;
  if(lineLedger&&lineLedger.isConnected)bottom=Math.max(0,Math.round((lineFrame.getBoundingClientRect().bottom-lineLedger.getBoundingClientRect().bottom)*100)/100);
  var value=bottom+'px';if(lineFrame.style.getPropertyValue('--line-bottom')!==value)lineFrame.style.setProperty('--line-bottom',value);
}
function scheduleSideLine(){if(!lineRaf)lineRaf=requestAnimationFrame(updateSideLine)}
var lineObserver=typeof ResizeObserver==='function'?new ResizeObserver(scheduleSideLine):null;

  var next=app.querySelector('.home-main .ledger');
  if(next!==lineLedger){if(lineObserver&&lineLedger)lineObserver.unobserve(lineLedger);lineLedger=next;if(lineObserver&&lineLedger)lineObserver.observe(lineLedger)}
  if(lineRaf){cancelAnimationFrame(lineRaf);lineRaf=0}updateSideLine();
}
