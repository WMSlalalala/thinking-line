<span class="ltx_p" id="A1.T5.5.2.2.1.1"><span class="ltx_text ltx_font_bold" id="A1.T5.5.2.2.1.1.1" style="font-size:90%;">System:</span><span class="ltx_text" id="A1.T5.5.2.2.1.1.2" style="font-size:90%;"> You are a strict grader for flawed-premise (abstention) questions. Judge whether a model answer correctly identifies that the question premise is wrong, consistent with the reference answer. If the model follows the flawed premise and gives a concrete answer under that premise, it must be graded 0. If the model’s final answer is just UNKNOWN / cannot determine without identifying the flaw, grade 0. If the model is contradictory (both rejects premise and also gives a concrete premise-following answer), grade 0. Paraphrases are allowed when they preserve the same core flaw described by the reference answer.</span></span>
<span class="ltx_p" id="A1.T5.5.2.2.1.2"><span class="ltx_text ltx_font_bold" id="A1.T5.5.2.2.1.2.1" style="font-size:90%;">User:</span><span class="ltx_text" id="A1.T5.5.2.2.1.2.2" style="font-size:90%;"> Evaluate whether the model correctly handled a flawed-premise question.</span></span>

<span class="ltx_p" id="A1.T5.5.2.2.1.4"><span class="ltx_text ltx_font_bold" id="A1.T5.5.2.2.1.4.1" style="font-size:90%;">Reference answer:</span><span class="ltx_text" id="A1.T5.5.2.2.1.4.2" style="font-size:90%;"> </span><span class="ltx_text ltx_font_typewriter" id="A1.T5.5.2.2.1.4.3" style="font-size:90%;">{reference_answer}</span></span>
<span class="ltx_p" id="A1.T5.5.2.2.1.5"><span class="ltx_text ltx_font_bold" id="A1.T5.5.2.2.1.5.1" style="font-size:90%;">Model full response:</span><span class="ltx_text" id="A1.T5.5.2.2.1.5.2" style="font-size:90%;"> </span><span class="ltx_text ltx_font_typewriter" id="A1.T5.5.2.2.1.5.3" style="font-size:90%;">{model_full_response}</span></span>
<span class="ltx_p" id="A1.T5.5.2.2.1.6"><span class="ltx_text ltx_font_bold" id="A1.T5.5.2.2.1.6.1" style="font-size:90%;">Model extracted final answer:</span><span class="ltx_text" id="A1.T5.5.2.2.1.6.2" style="font-size:90%;"> </span><span class="ltx_text ltx_font_typewriter" id="A1.T5.5.2.2.1.6.3" style="font-size:90%;">{model_final_answer}</span></span>
<span class="ltx_p" id="A1.T5.5.2.2.1.7"><span class="ltx_text ltx_font_bold" id="A1.T5.5.2.2.1.7.1" style="font-size:90%;">Scoring rubric:</span><span class="ltx_text" id="A1.T5.5.2.2.1.7.2" style="font-size:90%;"> Label 1 only if the model clearly identifies the flawed premise and reaches a conclusion equivalent to the reference answer. Label 1 also if the model explicitly says it lacks access to the user’s specific live environment/instance/configuration and therefore cannot verify, provided it does not give a concrete premise-following answer. Label 0 if the model follows the flawed premise and gives a concrete answer under that premise. Label 0 for generic UNKNOWN/insufficient-info replies that do not identify a flaw and do not make the explicit environment-access limitation clear. Label 0 if contradictory.</span></span>

<span class="ltx_p" id="A2.T8.5.3.2.1.1"><span class="ltx_text" id="A2.T8.5.3.2.1.1.1" style="font-size:90%;">You are an experienced colleague working in a customized web environment. Read </span><span class="ltx_text ltx_font_typewriter" id="A2.T8.5.3.2.1.1.2" style="font-size:90%;">question.json</span><span class="ltx_text" id="A2.T8.5.3.2.1.1.3" style="font-size:90%;"> and inspect every trajectory under </span><span class="ltx_text ltx_font_typewriter" id="A2.T8.5.3.2.1.1.4" style="font-size:90%;">trajectories/</span><span class="ltx_text" id="A2.T8.5.3.2.1.1.5" style="font-size:90%;">. This package comes from a public-environment-based setup that has been customized. Do not rely on prior knowledge of the public environment. Work only from the provided trajectories and copied question assets. Use only the question and the provided trajectories. Do not browse anywhere else, do not inspect other question folders, and do not use outside resources. If the question specifies an answer format, follow it exactly. For multiple-choice questions, write only the boxed letter corresponding to your answer, e.g., </span><span class="ltx_text ltx_font_typewriter" id="A2.T8.5.3.2.1.1.6" style="font-size:90%;">\boxed{A}</span><span class="ltx_text" id="A2.T8.5.3.2.1.1.7" style="font-size:90%;">, into the answer field. Write your final answer to </span><span class="ltx_text ltx_font_typewriter" id="A2.T8.5.3.2.1.1.8" style="font-size:90%;">answer.json</span><span class="ltx_text" id="A2.T8.5.3.2.1.1.9" style="font-size:90%;"> using this exact schema: </span><span class="ltx_text ltx_font_typewriter" id="A2.T8.5.3.2.1.1.10" style="font-size:90%;">{"answer": "&lt;your final answer&gt;"}</span><span class="ltx_text" id="A2.T8.5.3.2.1.1.11" style="font-size:90%;">.</span></span>
</span></td></tr>

<span class="ltx_p" id="A2.T8.5.4.1.1.1"><span class="ltx_text" id="A2.T8.5.4.1.1.1.1" style="font-size:90%;">Codex invocation prompt</span></span>
</span></td>
<td class="ltx_td ltx_align_left ltx_align_top ltx_border_bb ltx_border_t" id="A2.T8.5.4.2">
<span class="ltx_inline-block ltx_align_top" id="A2.T8.5.4.2.1" style="width:262.2pt;">
<span class="ltx_p" id="A2.T8.5.4.2.1.1"><span class="ltx_text" id="A2.T8.5.4.2.1.1.1" style="font-size:90%;">You are an experienced colleague working in a customized web environment. Read the local files in this directory, especially </span><span class="ltx_text ltx_font_typewriter" id="A2.T8.5.4.2.1.1.2" style="font-size:90%;">INSTRUCTION.md</span><span class="ltx_text" id="A2.T8.5.4.2.1.1.3" style="font-size:90%;"> and </span><span class="ltx_text ltx_font_typewriter" id="A2.T8.5.4.2.1.1.4" style="font-size:90%;">question.json</span><span class="ltx_text" id="A2.T8.5.4.2.1.1.5" style="font-size:90%;">. If </span><span class="ltx_text ltx_font_typewriter" id="A2.T8.5.4.2.1.1.6" style="font-size:90%;">question.json</span><span class="ltx_text" id="A2.T8.5.4.2.1.1.7" style="font-size:90%;"> refers to a screenshot, view it carefully. Use only local files in this directory. Solve the task and write your final answer to </span><span class="ltx_text ltx_font_typewriter" id="A2.T8.5.4.2.1.1.8" style="font-size:90%;">answer.json</span><span class="ltx_text" id="A2.T8.5.4.2.1.1.9" style="font-size:90%;"> as valid JSON with a non-empty string field named </span><span class="ltx_text ltx_font_typewriter" id="A2.T8.5.4.2.1.1.10" style="font-size:90%;">answer</span><span class="ltx_text" id="A2.T8.5.4.2.1.1.11" style="font-size:90%;">. If </span><span class="ltx_text ltx_font_typewriter" id="A2.T8.5.4.2.1.1.12" style="font-size:90%;">answer.json</span><span class="ltx_text" id="A2.T8.5.4.2.1.1.13" style="font-size:90%;"> already exists, update only the </span><span class="ltx_text ltx_font_typewriter" id="A2.T8.5.4.2.1.1.14" style="font-size:90%;">answer</span><span class="ltx_text" id="A2.T8.5.4.2.1.1.15" style="font-size:90%;"> value. Follow the formatting instructions in </span><span class="ltx_text ltx_font_typewriter" id="A2.T8.5.4.2.1.1.16" style="font-size:90%;">question.json</span><span class="ltx_text" id="A2.T8.5.4.2.1.1.17" style="font-size:90%;">. For multiple-choice questions, write only the boxed letter corresponding to your answer, e.g., </span><span class="ltx_text ltx_font_typewriter" id="A2.T8.5.4.2.1.1.18" style="font-size:90%;">\boxed{A}</span><span class="ltx_text" id="A2.T8.5.4.2.1.1.19" style="font-size:90%;">, into the answer field.</span></span>
</span></td></tr>

<span class="ltx_p" id="A3.T9.5.1.2.1.1"><span class="ltx_text ltx_font_bold" id="A3.T9.5.1.2.1.1.1" style="font-size:90%;">Template</span></span>

<tr class="ltx_tr" id="A3.T9.5.2">
<td class="ltx_td ltx_align_left ltx_align_top ltx_border_t" id="A3.T9.5.2.1" style="padding:0.35pt 4.0pt;">
<span class="ltx_inline-block ltx_align_top" id="A3.T9.5.2.1.1" style="width:62.1pt;">
<span class="ltx_p" id="A3.T9.5.2.1.1.1"><span class="ltx_text" id="A3.T9.5.2.1.1.1.1" style="font-size:90%;">Procedure and hint note generation</span></span>
</span></td>
<td class="ltx_td ltx_align_left ltx_align_top ltx_border_t" id="A3.T9.5.2.2" style="padding:0.35pt 4.0pt;">
<span class="ltx_inline-block ltx_align_top" id="A3.T9.5.2.2.1" style="width:265.7pt;">
<span class="ltx_p" id="A3.T9.5.2.2.1.1"><span class="ltx_text ltx_font_bold" id="A3.T9.5.2.2.1.1.1" style="font-size:90%;">System:</span><span class="ltx_text" id="A3.T9.5.2.2.1.1.2" style="font-size:90%;"> You convert one UI task trajectory into two reusable memory notes for a future agent. Assume these notes will later be retrieved for unknown future questions. Preserve the workflow and the highest-value reusable facts from the touched pages. Write </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.2.2.1.1.3" style="font-size:90%;">procedure_note</span><span class="ltx_text" id="A3.T9.5.2.2.1.1.4" style="font-size:90%;"> and </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.2.2.1.1.5" style="font-size:90%;">hint_note</span><span class="ltx_text" id="A3.T9.5.2.2.1.1.6" style="font-size:90%;">. Each note must contain </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.2.2.1.1.7" style="font-size:90%;">title</span><span class="ltx_text" id="A3.T9.5.2.2.1.1.8" style="font-size:90%;">, </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.2.2.1.1.9" style="font-size:90%;">description</span><span class="ltx_text" id="A3.T9.5.2.2.1.1.10" style="font-size:90%;">, and </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.2.2.1.1.11" style="font-size:90%;">content</span><span class="ltx_text" id="A3.T9.5.2.2.1.1.12" style="font-size:90%;">. Use only evidence grounded in the provided goal, outcome, thoughts, annotated actions, and screenshots. Do not invent unseen fields, filters, modules, or outcomes. If the run failed, describe only the intended or attempted workflow where the evidence supports it. Keep the procedure note focused on the reliable core workflow and use the hint note for durable facts, pitfalls, option sets, confirmation signals, absent functionality, and distinctions between easily confused controls. Return only valid JSON:
</span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.2.2.1.1.13" style="font-size:90%;">{"procedure_note":{"title":"...","description":"...","content":"- ..."},"hint_note":{"title":"...","description":"...","content":"- ..."}}</span><span class="ltx_text" id="A3.T9.5.2.2.1.1.14" style="font-size:90%;">.</span></span>
<span class="ltx_p" id="A3.T9.5.2.2.1.2"><span class="ltx_text ltx_font_bold" id="A3.T9.5.2.2.1.2.1" style="font-size:90%;">User:</span><span class="ltx_text" id="A3.T9.5.2.2.1.2.2" style="font-size:90%;"> Extract two reusable notes from this UI task run. Goal: </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.2.2.1.2.3" style="font-size:90%;">{goal}</span><span class="ltx_text" id="A3.T9.5.2.2.1.2.4" style="font-size:90%;">. Outcome: </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.2.2.1.2.5" style="font-size:90%;">{outcome}</span><span class="ltx_text" id="A3.T9.5.2.2.1.2.6" style="font-size:90%;">. Start URL: </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.2.2.1.2.7" style="font-size:90%;">{start_url}</span><span class="ltx_text" id="A3.T9.5.2.2.1.2.8" style="font-size:90%;">. Each state block is followed by the screenshot for that state. The action line is the action taken from that state, annotated with recoverable object or module details. </span><span class="ltx_text ltx_font_italic" id="A3.T9.5.2.2.1.2.9" style="font-size:90%;">Then include the ordered state blocks, thoughts, annotated actions, and screenshots.</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A3.T9.5.3">
<td class="ltx_td ltx_align_left ltx_align_top ltx_border_t" id="A3.T9.5.3.1" style="padding:0.35pt 4.0pt;">
<span class="ltx_inline-block ltx_align_top" id="A3.T9.5.3.1.1" style="width:62.1pt;">
<span class="ltx_p" id="A3.T9.5.3.1.1.1"><span class="ltx_text" id="A3.T9.5.3.1.1.1.1" style="font-size:90%;">State-transition event generation</span></span>
</span></td>
<td class="ltx_td ltx_align_left ltx_align_top ltx_border_t" id="A3.T9.5.3.2" style="padding:0.35pt 4.0pt;">
<span class="ltx_inline-block ltx_align_top" id="A3.T9.5.3.2.1" style="width:265.7pt;">
<span class="ltx_p" id="A3.T9.5.3.2.1.1"><span class="ltx_text ltx_font_bold" id="A3.T9.5.3.2.1.1.1" style="font-size:90%;">System:</span><span class="ltx_text" id="A3.T9.5.3.2.1.1.2" style="font-size:90%;"> You convert one UI transition from a longer task trajectory into retrieval-ready event text. You will be given the task goal and outcome, the full annotated action trace, and one target transition defined as pre-state, annotated action, and post-state. Return exactly one JSON object:
</span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.3.2.1.1.3" style="font-size:90%;">{"overview":"...","state_transition":"..."}</span><span class="ltx_text" id="A3.T9.5.3.2.1.1.4" style="font-size:90%;">. The overview briefly recaps the task goal and workflow stage. The state-transition field explicitly compares the post-state to the pre-state and describes what changed after the action, such as a new page, revealed panel, form fields, changed values, confirmation signal, blocker, popup, navigation, or lack of visible change. Ground the output only in the provided evidence and preserve exact UI labels when available.</span></span>
<span class="ltx_p" id="A3.T9.5.3.2.1.2"><span class="ltx_text ltx_font_bold" id="A3.T9.5.3.2.1.2.1" style="font-size:90%;">User:</span><span class="ltx_text" id="A3.T9.5.3.2.1.2.2" style="font-size:90%;"> Generate an event for transition </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.3.2.1.2.3" style="font-size:90%;">{state_i} -&gt; {state_j}</span><span class="ltx_text" id="A3.T9.5.3.2.1.2.4" style="font-size:90%;">. Goal: </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.3.2.1.2.5" style="font-size:90%;">{goal}</span><span class="ltx_text" id="A3.T9.5.3.2.1.2.6" style="font-size:90%;">. Outcome: </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.3.2.1.2.7" style="font-size:90%;">{outcome}</span><span class="ltx_text" id="A3.T9.5.3.2.1.2.8" style="font-size:90%;">. Full action trace: </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.3.2.1.2.9" style="font-size:90%;">{actions}</span><span class="ltx_text" id="A3.T9.5.3.2.1.2.10" style="font-size:90%;">. Pre-state: </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.3.2.1.2.11" style="font-size:90%;">{url, thoughts, action, AXTree, screenshot}</span><span class="ltx_text" id="A3.T9.5.3.2.1.2.12" style="font-size:90%;">. Post-state: </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.3.2.1.2.13" style="font-size:90%;">{url, thoughts, action, AXTree, screenshot}</span><span class="ltx_text" id="A3.T9.5.3.2.1.2.14" style="font-size:90%;">.</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A3.T9.5.4">
<td class="ltx_td ltx_align_left ltx_align_top ltx_border_bb ltx_border_t" id="A3.T9.5.4.1" style="padding:0.35pt 4.0pt;">
<span class="ltx_inline-block ltx_align_top" id="A3.T9.5.4.1.1" style="width:62.1pt;">
<span class="ltx_p" id="A3.T9.5.4.1.1.1"><span class="ltx_text" id="A3.T9.5.4.1.1.1.1" style="font-size:90%;">Query generation</span></span>
</span></td>
<td class="ltx_td ltx_align_left ltx_align_top ltx_border_bb ltx_border_t" id="A3.T9.5.4.2" style="padding:0.35pt 4.0pt;">
<span class="ltx_inline-block ltx_align_top" id="A3.T9.5.4.2.1" style="width:265.7pt;">
<span class="ltx_p" id="A3.T9.5.4.2.1.1"><span class="ltx_text ltx_font_bold" id="A3.T9.5.4.2.1.1.1" style="font-size:90%;">System:</span><span class="ltx_text" id="A3.T9.5.4.2.1.1.2" style="font-size:90%;"> You generate structured retrieval queries for an active memory system with three pools: raw state slices, state-transition events, and procedure/hint notes. Return exactly one JSON object:
</span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.4.2.1.1.3" style="font-size:90%;">{"raw_state_queries":["..."],"event_query":"...","note_query":"..."}</span><span class="ltx_text" id="A3.T9.5.4.2.1.1.4" style="font-size:90%;">. Maximize retrieval of memory entries that would help answer the question later. Do not answer the question yourself. Use raw-state queries for exact UI surface evidence, such as pages, forms, records, tabs, fields, buttons, dropdowns, options, labels, values, counts, and missing controls. Use the event query only when navigation, before/after change, revealed content, confirmation, blocker, popup, or workflow stage matters. Use the note query for reusable procedures, module paths, disambiguation, absent functionality, pitfalls, and durable hints. Remove formatting instructions and final-answer wrappers. Preserve exact entity names and literal UI labels. Deduplicate raw-state queries and cap them at five. Return JSON only.</span></span>
<span class="ltx_p" id="A3.T9.5.4.2.1.2"><span class="ltx_text ltx_font_bold" id="A3.T9.5.4.2.1.2.1" style="font-size:90%;">User:</span><span class="ltx_text" id="A3.T9.5.4.2.1.2.2" style="font-size:90%;"> Memory pool summary: </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.4.2.1.2.3" style="font-size:90%;">{runtime_summary}</span><span class="ltx_text" id="A3.T9.5.4.2.1.2.4" style="font-size:90%;">. Output schema example: </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.4.2.1.2.5" style="font-size:90%;">{schema_example}</span><span class="ltx_text" id="A3.T9.5.4.2.1.2.6" style="font-size:90%;">. Prompt examples: </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.4.2.1.2.7" style="font-size:90%;">{few_shot_examples}</span><span class="ltx_text" id="A3.T9.5.4.2.1.2.8" style="font-size:90%;">. Question ID: </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.4.2.1.2.9" style="font-size:90%;">{question_id}</span><span class="ltx_text" id="A3.T9.5.4.2.1.2.10" style="font-size:90%;">. Question type: </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.4.2.1.2.11" style="font-size:90%;">{question_type}</span><span class="ltx_text" id="A3.T9.5.4.2.1.2.12" style="font-size:90%;">. Question text: </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.4.2.1.2.13" style="font-size:90%;">{question}</span><span class="ltx_text" id="A3.T9.5.4.2.1.2.14" style="font-size:90%;">. Question image path: </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.4.2.1.2.15" style="font-size:90%;">{image_path or &lt;none&gt;}</span><span class="ltx_text" id="A3.T9.5.4.2.1.2.16" style="font-size:90%;">. Original goals attached to this benchmark question: </span><span class="ltx_text ltx_font_typewriter" id="A3.T9.5.4.2.1.2.17" style="font-size:90%;">{original_goals}</span><span class="ltx_text" id="A3.T9.5.4.2.1.2.18" style="font-size:90%;">. Return only the JSON object.</span></span>
</span></td></tr>

<span class="ltx_p" id="A3.T11.5.2.2.1.1"><span class="ltx_text" id="A3.T11.5.2.2.1.1.1" style="font-size:90%;">You are acting as the query-time agent for Coding Agent Memory. Read the local files in this directory, especially </span><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.2.2.1.1.2" style="font-size:90%;">INSTRUCTION.md</span><span class="ltx_text" id="A3.T11.5.2.2.1.1.3" style="font-size:90%;"> and </span><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.2.2.1.1.4" style="font-size:90%;">question.json</span><span class="ltx_text" id="A3.T11.5.2.2.1.1.5" style="font-size:90%;">. The local </span><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.2.2.1.1.6" style="font-size:90%;">trajectories/</span><span class="ltx_text" id="A3.T11.5.2.2.1.1.7" style="font-size:90%;"> directory contains the current haystack for this evaluation item, and you must explore </span><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.2.2.1.1.8" style="font-size:90%;">trajectories/</span><span class="ltx_text" id="A3.T11.5.2.2.1.1.9" style="font-size:90%;"> before returning your final result. If </span><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.2.2.1.1.10" style="font-size:90%;">question.json</span><span class="ltx_text" id="A3.T11.5.2.2.1.1.11" style="font-size:90%;"> refers to an image, view it carefully. Write your final result to </span><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.2.2.1.1.12" style="font-size:90%;">memory_module_output.json</span><span class="ltx_text" id="A3.T11.5.2.2.1.1.13" style="font-size:90%;"> as valid JSON. Use the local inspection helper under </span><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.2.2.1.1.14" style="font-size:90%;">scripts/</span><span class="ltx_text" id="A3.T11.5.2.2.1.1.15" style="font-size:90%;"> when you need to inspect one trajectory, one state, one span, or match text within one trajectory quickly.</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A3.T11.5.3">
<td class="ltx_td ltx_align_left ltx_align_top ltx_border_t" id="A3.T11.5.3.1" style="padding:0.35pt 4.0pt;">

<span class="ltx_p" id="A3.T11.5.3.1.1.1"><span class="ltx_text" id="A3.T11.5.3.1.1.1.1" style="font-size:90%;">Task overview in </span><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.3.1.1.1.2" style="font-size:90%;">INSTRUCTION.md</span></span>
</span></td>
<td class="ltx_td ltx_nopad_r ltx_align_left ltx_align_top ltx_border_t" id="A3.T11.5.3.2" style="padding:0.35pt 4.0pt;">
<span class="ltx_inline-block ltx_align_top" id="A3.T11.5.3.2.1" style="width:265.7pt;">
<span class="ltx_p" id="A3.T11.5.3.2.1.1"><span class="ltx_text" id="A3.T11.5.3.2.1.1.1" style="font-size:90%;">You are acting as a quick memory retrieval module to provide contexts from agent trajectories collected from a customized web environment for a downstream reader to answer questions specific to that environment. The question is in </span><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.3.2.1.1.2" style="font-size:90%;">question.json</span><span class="ltx_text" id="A3.T11.5.3.2.1.1.3" style="font-size:90%;">. Aggregate information from the local </span><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.3.2.1.1.4" style="font-size:90%;">trajectories/</span><span class="ltx_text" id="A3.T11.5.3.2.1.1.5" style="font-size:90%;"> directory. Follow the workflow and do not attempt to re-verify or rebuild maps unnecessarily, since the task has latency constraints. Be quick and do not over-explore unless necessary. Work inside the current directory and never explore outside it.</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A3.T11.5.4">
<td class="ltx_td ltx_align_left ltx_align_top ltx_border_t" id="A3.T11.5.4.1" style="padding:0.35pt 4.0pt;">
<span class="ltx_inline-block ltx_align_top" id="A3.T11.5.4.1.1" style="width:62.1pt;">
<span class="ltx_p" id="A3.T11.5.4.1.1.1"><span class="ltx_text" id="A3.T11.5.4.1.1.1.1" style="font-size:90%;">Output requirement</span></span>
</span></td>
<td class="ltx_td ltx_nopad_r ltx_align_left ltx_align_top ltx_border_t" id="A3.T11.5.4.2" style="padding:0.35pt 4.0pt;">
<span class="ltx_inline-block ltx_align_top" id="A3.T11.5.4.2.1" style="width:265.7pt;">
<span class="ltx_p" id="A3.T11.5.4.2.1.1"><span class="ltx_text" id="A3.T11.5.4.2.1.1.1" style="font-size:90%;">Write the final result to </span><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.4.2.1.1.2" style="font-size:90%;">memory_module_output.json</span><span class="ltx_text" id="A3.T11.5.4.2.1.1.3" style="font-size:90%;"> as valid JSON:
</span><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.4.2.1.1.4" style="font-size:90%;">{"memory_markdown":"## Support Analysis\n...\n\n## Relevant Procedure and Hint Notes\n...","trajectory_spans":[{"trajectory_id":"...",</span></span>
<span class="ltx_p" id="A3.T11.5.4.2.1.2"><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.4.2.1.2.1" style="font-size:90%;">"start_state_index":0,"end_state_index":0}]}</span><span class="ltx_text" id="A3.T11.5.4.2.1.2.2" style="font-size:90%;">.
The support analysis should briefly describe where the evidence can be found. If the evidence contradicts the premise of the question, clearly say that the premise is wrong and include the contradicting evidence. The trajectory spans must use zero-based inclusive indices and preserve order by importance.</span></span>

<tr class="ltx_tr" id="A3.T11.5.5">
<td class="ltx_td ltx_align_left ltx_align_top ltx_border_t" id="A3.T11.5.5.1" style="padding:0.35pt 4.0pt;">
<span class="ltx_inline-block ltx_align_top" id="A3.T11.5.5.1.1" style="width:62.1pt;">
<span class="ltx_p" id="A3.T11.5.5.1.1.1"><span class="ltx_text" id="A3.T11.5.5.1.1.1.1" style="font-size:90%;">Workflow instruction</span></span>
</span></td>
<td class="ltx_td ltx_nopad_r ltx_align_left ltx_align_top ltx_border_t" id="A3.T11.5.5.2" style="padding:0.35pt 4.0pt;">
<span class="ltx_inline-block ltx_align_top" id="A3.T11.5.5.2.1" style="width:265.7pt;">
<span class="ltx_p" id="A3.T11.5.5.2.1.1"><span class="ltx_text" id="A3.T11.5.5.2.1.1.1" style="font-size:90%;">First classify the question before opening trajectories in detail. If the question contains an image, inspect it and align it with the matching surface or state. For direct lookup questions, find an exact state showing the requested field, value, button, or page. For comparison questions, find one supporting state per side when needed. For procedure questions, stay within the same workflow family unless the question explicitly asks for a shared pattern across workflows. Start from </span><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.5.2.1.1.2" style="font-size:90%;">TRAJECTORY_SUMMARY_FULL.md</span><span class="ltx_text" id="A3.T11.5.5.2.1.1.3" style="font-size:90%;"> and shortlist only a few likely trajectories using the goal, start URL, action sequence, and final reward. Prefer the helper script for exact verification:
</span><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.5.2.1.1.4" style="font-size:90%;">python scripts/inspect_trajectory.py &lt;trajectory_id&gt;</span><span class="ltx_text" id="A3.T11.5.5.2.1.1.5" style="font-size:90%;">,
</span><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.5.2.1.1.6" style="font-size:90%;">--state &lt;i&gt;</span><span class="ltx_text" id="A3.T11.5.5.2.1.1.7" style="font-size:90%;">,
</span><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.5.2.1.1.8" style="font-size:90%;">--span &lt;i:j&gt;</span><span class="ltx_text" id="A3.T11.5.5.2.1.1.9" style="font-size:90%;">, or
</span><span class="ltx_text ltx_font_typewriter" id="A3.T11.5.5.2.1.1.10" style="font-size:90%;">--match "&lt;pattern&gt;"</span><span class="ltx_text" id="A3.T11.5.5.2.1.1.11" style="font-size:90%;">.
Use the helper on shortlisted trajectories rather than performing broad raw-file search. Keep the final evidence package small, usually no more than three states per span, and use at most 20 states in total.</span></span>
</span></td></tr>
<tr class="ltx_tr" id="A3.T11.5.6">

</span></td>
<td class="ltx_td ltx_nopad_r ltx_align_left ltx_align_top ltx_border_bb ltx_border_t" id="A3.T11.5.6.2" style="padding:0.35pt 4.0pt;">

<span class="ltx_p" id="A3.T11.5.6.2.1.1"><span class="ltx_text" id="A3.T11.5.6.2.1.1.1" style="font-size:90%;">Move fast and prefer targeted exploration. Put the most important evidence first. Avoid redundant trajectories when multiple trajectories support the same fact. Reject nearby but non-exact matches. Do not copy screenshots or large AXTree blocks into the JSON output. You may write scratch files in the current directory if needed.</span></span>
